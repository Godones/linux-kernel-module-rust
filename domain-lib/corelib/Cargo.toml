[package]
name = "corelib"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
spin = "0"
interface = { path = "../interface" }
pconst = { git = "https://github.com/os-module/pconst.git", features = ["special_error"] }
shared_heap = { git = "https://github.com/os-module/domain-lib" }
storage = { git = "https://github.com/os-module/domain-lib", features = ["impl"] }
# storage = { path = "../storage" }

kbind  = { path = "../../kbind" }
pinned-init = { git = "https://github.com/Godones/pinned-init", default-features = false, features = ["alloc"] }
kmacro = { path = "../../kmacro" }
log = "0.4.22"
wrapper_macro = { git = "https://github.com/os-module/domain-lib" }

[features]
core_impl = []
blk-panic = []