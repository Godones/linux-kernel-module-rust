[package]
name = "basic"
version = "0.1.0"
edition = "2021"

[dependencies]
corelib = { path = "../corelib", features = ["core_impl"]}
log = "0.4.22"
rref = { path = "../rref" }
ksync = { path = "../ksync" }
domain_main = { path = "../domain_main" }

unwinding = { git = "https://github.com/nbdd0121/unwinding", rev = "ff0e91b", default-features = false, features = [
    "unwinder",
    "fde-gnu-eh-frame-hdr",
    "panic",
    "personality",
    "dwarf-expr",
], optional = true }
spin = "0.9.8"

[features]
default = ["unwind"]
unwind = ["dep:unwinding"]