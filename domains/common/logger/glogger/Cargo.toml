[package]
name = "glogger"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
malloc = { git = "https://github.com/os-module/domain-lib" }
corelib = { path = "../../../../domain-lib/corelib" }
basic = { path = "../../../../domain-lib/basic",  default-features = false  }
shared_heap = { git = "https://github.com/os-module/domain-lib" }
interface = { path = "../../../../domain-lib/interface",  features = ["domain"]  }
storage = { git = "https://github.com/os-module/domain-lib", features = ["impl"] }

logger = { path = "../logger" }


[features]
default = ["rust-unwind"]
rust-unwind = []


