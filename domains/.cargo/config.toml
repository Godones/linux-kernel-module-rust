[target.riscv64]
rustflags = [
    "-Clink-arg=-T../../domain-riscv64.ld",
    "-Clink-arg=-pie",
    "-A", "unused_imports",
]
linker = "riscv64-linux-gnu-gcc"

[target.x86_64]
rustflags = [
    "-Clink-arg=-T../../domain-x86_64.ld",
    "-Clink-arg=-pie",
    "-Clink-arg=--no-dynamic-linker",
    "-A", "unused_imports",
]

[profile.release]
#lto = "fat"
strip = true
#opt-level = 3