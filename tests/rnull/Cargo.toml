[package]
name = "rnull"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
kernel = { path = "../../kernel" }
pinned-init = { git = "https://github.com/Godones/pinned-init", default-features = false, features = ["alloc"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(MODULE)'] }