[package]
name = "tcb"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
# domain lib
interface = { path = "../domain-lib/interface" }
corelib = { path = "../domain-lib/corelib" }
basic = { path = "../domain-lib/basic", default-features = false }
ksync = { path = "../domain-lib/ksync" }
shared_heap = { git = "https://github.com/os-module/domain-lib" }
storage = { git = "https://github.com/os-module/domain-lib" }
# storage = { path = "../domain-lib/storage", features = ["impl"] }
loader = { git = "https://github.com/os-module/domain-lib" }
#loader = { path = "../domain-lib/loader" }
command = { path = "../domain-lib/command" }
domain_manager = { git = "https://github.com/os-module/domain-lib" }

#
log = "0"
hashbrown = "0.14.5"
xmas-elf = "0.9"
bitflags = "2.6.0"
memory_addr = { git ="https://github.com/os-module/memory_addr" }
spin = "0.9.8"
# kernel bind
kernel = { path = "../kernel" }
