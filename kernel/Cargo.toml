[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
pinned-init = { version = "0.0.8", default-features = false, features = ["alloc"] }
kmacro = { path = "../kmacro" }
bitflags = "2.6.0"
log = "0.4.22"
kbind = { path = "../kbind" }

unwinding = { git = "https://github.com/nbdd0121/unwinding", rev = "ff0e91b", default-features = false, features = [
    "unwinder",
    "fde-static",
    "panic",
    "personality"
] }

[build-dependencies]
bindgen = "0.70"
cc = "1.0"
shlex = "1"
